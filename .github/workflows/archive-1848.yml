name: Archive stale design pages (#1848)

on:
  push:
    branches:
      - docs/1848-archive-stale-design-pages

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contribution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install Pyrite CLI
        run: |
          uv pip install --system -c "$(scripts/lock-constraints.sh)" -e ".[all]"

      - name: Archive the nine pages through the Pyrite CLI
        run: |
          set -euo pipefail
          for id in launch-plan launch-channels launch-staging launch-user-types launch-messaging launch-web-presence mcp-submission ssr-public-site permissions-model; do
            pyrite update "$id" -k pyrite --lifecycle archived
          done

      - name: Validate KB and index
        run: |
          set -euo pipefail
          pyrite schema validate kb/
          pyrite index sync
          pyrite index health
          for id in launch-plan launch-channels launch-staging launch-user-types launch-messaging launch-web-presence mcp-submission ssr-public-site permissions-model; do
            pyrite backlinks "$id" -k pyrite
          done
          git diff --check

      - name: Commit CLI-generated lifecycle metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb/designs/launch-plan.md kb/designs/launch-channels.md kb/designs/launch-staging.md kb/designs/launch-user-types.md kb/designs/launch-messaging.md kb/designs/launch-web-presence.md kb/designs/mcp-submission.md kb/designs/ssr-public-site.md kb/designs/permissions-model.md
          if git diff --cached --quiet; then
            echo "No lifecycle changes were generated."
            exit 1
          fi
          git commit -m "docs(kb): archive superseded design pages"
          git push origin HEAD:docs/1848-archive-stale-design-pages
